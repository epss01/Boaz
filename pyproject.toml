[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boaz"
version = "0.2.0"
description = "A local farming assistant foundation with read-only Android preview and simulation"
requires-python = ">=3.11,<3.12"
dependencies = ["airtest>=1.4,<2", "nicegui>=3,<4", "pydantic>=2,<3", "pytesseract>=0.3.13,<0.4"]

[project.scripts]
boaz = "boaz.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
cache-dir = ".uv-cache"

